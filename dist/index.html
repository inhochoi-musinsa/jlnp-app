는 ために에 대응하는데, '~기 위해'에서 연상해 ために를 고르기 쉬우므로 주의해야 합니다.",domain:"GRAMMAR_FORM",scoringSection:"LANGUAGE_KNOWLEDGE"},provenance:{origin:"AI_GENERATED",generatorModel:"claude-sonnet-5-5",llmProvider:"headless",resolved:!0,runId:"20261016-232508-seed3-target_language-fad0",promptVersion:"revise@1",createdAt:"2026-10-16T14:25:22.300Z"},verification:{status:"VERIFIED",selfAttested:!1,verifierModel:"claude-opus-5-5",verifierProvider:"headless",verifierResolved:!0,rounds:3,checks:[{id:"SCHEMA_LINT",result:"PASS"},{id:"READING_CHECK",result:"PASS"},{id:"BLIND_SOLVE",result:"PASS",note:"2/2 rounds matched"},{id:"DISTRACTOR_CHECK",result:"PASS"},{id:"QUALITY_CHECK",result:"PASS",note:"contextCues=3"},{id:"DEDUPE",result:"PASS"}],verifiedAt:"2026-10-16T14:27:43.434Z"},license:"ORIGINAL",contentHash:"cf59accd7bf099a7bc0eb69778018bb5179905b984278e707f171b49968ab18a"},{contentId:"q:33t6ougt6r",contentVersion:1,kind:"QUESTION",level:"N4",pool:"DIAG",tags:["KO_TRANSITIVITY","transitive-intransitive","diag:FOUNDATION"],payload:{stem:"きのうは風が強くて、窓が（　）、部屋がとても寒くなりました。",choices:[{id:"a",text:"開けて",whyWrong:"「開ける」는 사람이 무언가를 여는 타동사이므로, 바람 때문에 창문이 저절로 열린 상황(「窓が」)에는 맞지 않습니다.",howToCorrect:"자동사를 써서 「窓が開いて」로 고칩니다. 사람이 연 경우라면 「窓を開けて」가 됩니다."},{id:"b",text:"開いて"},{id:"c",text:"閉めて",whyWrong:"「閉める」는 사람이 창문을 닫는 타동사이고, 창문을 닫으면 추위를 막을 수 있으므로 방이 매우 추워졌다는 결과와 의미가 맞지 않습니다.",howToCorrect:"방이 추워진 원인은 창문이 열린 것이므로 「窓が開いて」로 고칩니다."},{id:"d",text:"閉まって",whyWrong:"「閉まる」는 자동사이므로 동사의 종류는 맞지만, 창문이 닫히면 방이 추워지지 않으므로 문맥상 의미가 맞지 않습니다.",howToCorrect:"방이 추워지는 원인으로 자연스러운 「開いて」로 고칩니다."}],correctChoiceId:"b",explanationKo:"「窓が」가 주어이고 바람이 원인이므로, 사람의 행위가 없는 자동사 「開く」를 써야 합니다. 「開けて」는 사람이 의도적으로 여는 타동사이므로 맞지 않습니다. 「閉めて」는 사람이 닫는 타동사이고, 「閉まって」는 자동사로 동사의 종류는 맞지만 창문이 닫히는 의미라서 방이 추워진 결과와 맞지 않습니다. 따라서 정답은 「開いて」(あいて)입니다.",domain:"CONTEXT",scoringSection:"LANGUAGE_KNOWLEDGE_READING"},provenance:{origin:"AI_GENERATED",generatorModel:"claude-sonnet-5-5",llmProvider:"headless",resolved:!0,runId:"20261016-225933-seed2-foundation-2d90",promptVer ,text:"おばさあん",whyWrong:"장음 あ를 さ 뒤에 넣어 길게 끄는 위치가 틀렸습니다.",howToCorrect:"길게 끄는 곳은 ば 뒤이므로 おばあさん으로 씁니다."},{id:"d",text:"おばあさん"}],correctChoiceId:"d",explanationKo:"おばあさん은 ば 뒤의 あ로 모음을 길게 늘이며 할머니를 뜻합니다. おばさん은 길게 끌지 않으며 아주머니·이모·고모를 뜻합니다.",domain:"KANA",scoringSection:"LANGUAGE_KNOWLEDGE_READING"},provenance:{origin:"AI_GENERATED",generatorModel:"claude-sonnet-5-5",llmProvider:"headless",resolved:!0,runId:"20261016-225248-seed0-kana-842f",promptVersion:"revise@1",createdAt:"2026-10-16T13:53:40.421Z"},verification:{status:"VERIFIED",selfAttested:!1,verifierModel:"claude-opus-5-5",verifierProvider:"headless",verifierResolved:!0,rounds:2,checks:[{id:"SCHEMA_LINT",result:"PASS"},{id:"READING_CHECK",result:"PASS"},{id:"BLIND_SOLVE",result:"PASS",note:"2/2 rounds matched"},{id:"DISTRACTOR_CHECK",result:"PASS"},{id:"QUALITY_CHECK",result:"PASS",note:"contextCues=2"},{id:"DEDUPE",result:"PASS"}],verifiedAt:"2026-10-16T13:54:41.984Z"},license:"ORIGINAL",contentHash:"93306d759604b26156b6d211d92e132878808d0f1bdfb577802084a91cd79edb"},{contentId:"q:7cc5at6scm",contentVersion:1,kind:"QUESTION",level:"N4",pool:"DIAG",tags:["adverb","GRAMMAR_NUANCE","diag:FOUNDATION"],payload:{stem:"毎日ねる前に練習しているので、日本語が（　）上手になりました。",choices:[{id:"a",text:"ぜんぜん",whyWrong:"「ぜんぜん」은 보통 「〜ません」 같은 부정문과 함께 쓰는 표현입니다. 그래서 긍정의 변화를 나타내는 「上手になりました」와는 표준적인 문장으로 어울리지 않습니다.",howToCorrect:"부정이라면 「ぜんぜん上手になりませんでした」, 긍정적인 변화라면 「だんだん上手になりました」라고 말합니다."},{id:"b",text:"もうすぐ",whyWrong:"「もうすぐ」는 가까운 미래를 나타내므로 과거형인 「なりました」와 어울리지 않습니다.",howToCorrect:"미래라면 「もうすぐ上手になります」, 과거에 일어난 변화라면 「だんだん」을 사용합니다."},{id:"c",text:"だんだん"},{id:"d",text:"まだ",whyWrong:"「まだ」는 어떤 상태가 아직 계속되고 있거나 아직 완료되지 않았음을 나타내므로, 변화가 일어났음을 말하는 「上手になりました」와는 의미가 맞지 않습니다.",howToCorrect:"변화가 일어난 것을 말할 때는 「だんだん上手になりました」, 아직 부족하다는 뜻이라면 「まだ上手になっていません」이라고 합니다."}],correctChoiceId:"c",explanationKo:"매일 연습한 결과 조금씩 변화했다는 뜻이므로 「だんだん」(점점)이 자연스럽습니다. 「ぜんぜん」은 주로 부정문, 「もうすぐ」는 가까운 미래, 「まだ」는 아직 계속되거나 완료되지 않은 상태를 나타낼 때 씁니다.",domain:"CONTEXT",scoringSection:"LANGUAGE_KNOWLEDGE_READING"},provenance:{origin:"AI_GENERATED",generatorModel:"claude-sonnet-5-5",llmProvider:"headless",resolved:!0,runId:"20261016-225933-seed2-foundation-2d90",promptVersion:"revise@1",createdAt:"2026-10-16T14:00:04.335Z"},verification:{status:"VERIFIED",selfAttested:!1,verifierModel:"claude-opus-5-5",verifierProvider:"headless",verifierResolved:!0,rounds:2,checks:[{id:"SCHEMA_LINT",result:"PASS"},{id:"READING_CHECK",result:"PASS"},{id:"BLIND_SOLVE",result:"PASS",note:"2/2 rounds matched"},{id:"DISTRACTOR_CHECK",result:"PASS"},{id:"QUALITY_CHECK",result:"PASS",note:"contextCues=2"},{id:"DEDUPE",result:"PASS"}],verifiedAt:"2026-10-16T14:01:18.807Z"},license:"ORIGINAL",contentHash:"0be140bdcec50f774939130674af854d9059958dddf235e15940a91214f5e5a0"},{contentId:"q:7q5qmt2bz7",contentVersion:1,kind:"QUESTION",level:"N5",pool:"DIAG",tags:["KO_PARTICLE_TRANSFER","particle-de","diag:FOUNDATION"],payload:{stem:"きのう、図書館＿＿ 友だちと 勉強しました。",choices:[{id:"a",text:"に",whyWrong:"「に」는 존재하는 장소나 도착점을 나타내는 조사입니다. 한국어의 '~에'는 흔히 「に」에 대응하지만, '도서관에서 공부했다'처럼 동작이 이루어지는 장소에는 「に」가 아니라 「で」를 씁니다. 「勉強する」는 동작이므로 「に」는 맞지 않습니다.",howToCorrect:"동작이 이루어지는 장소에는 「で」를 써서 「図書館で 勉強しました」라고 합니다."},{id:"b",text:"で"},{id:"c",text:"を",whyWrong:"「を」는 주로 동작의 대상(목적어)을 나타내며, 「公園を さんぽします」처럼 지나가는 장소를 나타낼 때도 쓰입니다. 하지만 「勉強する」는 이동 동사가 아니므로 「図書館を 勉強しました」처럼 장소에 「を」를 쓸 수 없습니다. 「を」가 장소에도 쓰인다고 해서 모든 동작 동사에 확대해서는 안 됩니다.",howToCorrect:"장소를 나타내려면 「図書館で」, 공부하는 대상을 나타내려면 「日本語を 勉強しました」처럼 말합니다."},{id:"d",text:"へ",whyWrong:"「へ」는 이동의 방향을 나타내는 조사이므로, 도서관 안에서 공부한다는 동작의 장소에는 쓸 수 없습니다.",howToCorrect:"이동을 말할 때는 「図書館へ 行きました」, 동작의 장소를 말할 때는 「図書館で 勉強しました」라고 합니다."}],correctChoiceId:"b",explanationKo:"「勉強しました」는 동작을 나타내는 동사이므로, 동작이 이루어지는 장소에는 조사 「で」를 씁니다. 한국어의 '~에서'에 해당합니다.",domain:"GRAMMAR_FORM",scoringSection:"LANGUAGE_KNOWLEDGE_READING"},provenance:{origin:"AI_GENERATED",generatorModel:"claude-sonnet-5-5",llmProvider:"headless",resolved:!0,runId:"20261016-225753-seed1-foundation-c8b1",promptVersion:"revise@1",createdAt:"2026-10-16T13:58:23.729Z"},verification:{s s:[{id:"a",text:"だけ",whyWrong:"「だけ」는 한국어 '만'과 뜻이 통해서 '게임만 하고 있어서'처럼 옮기기 쉽지만, 「ゲームをしてだけいて」처럼 「〜て」와 「いる」 사이에 「だけ」를 넣는 형태는 쓰지 않습니다. 한국어 '-고만 있다'를 그대로 옮긴 오류입니다.",howToCorrect:"「ゲームばかりしている」 또는 「ゲームをしているだけ」처럼 말합니다. 「〜てばかりいる」가 이 문맥에 맞는 자연스러운 형태입니다."},{id:"b",text:"しか",whyWrong:"「しか」는 뒤에 반드시 「ない」 같은 부정형이 와야 합니다. 「ゲームをしてしかいて」는 뒤가 긍정형 「いて」로 이어지므로 문장이 성립하지 않습니다.",howToCorrect:"「ゲームしかしていない」처럼 동사를 부정형으로 바꿔 사용합니다."},{id:"c",text:"ほど",whyWrong:"「ほど」는 정도를 나타내는 말입니다. 빈칸에 넣으면 「ゲームをしてほどいて」가 되어 문법적으로도 의미상으로도 성립하지 않습니다.",howToCorrect:"정도를 말하고 싶다면 「宿題を忘れるほどゲームに夢中だ」처럼 사용합니다."},{id:"d",text:"ばかり"}],correctChoiceId:"d",explanationKo:"「V-てばかりいる」는 같은 행동만 계속 반복하고 다른 일은 하지 않는다는 비난·불만의 뉘앙스를 나타냅니다. 뒤의 「宿題を全然やらない」와 자연스럽게 호응합니다. 「ゲームをしてばかりいて」는 '게임만 하고 있어서'라는 뜻입니다.",domain:"GRAMMAR_FORM",scoringSection:"LANGUAGE_KNOWLEDGE"},provenance:{origin:"AI_GENERATED",generatorModel:"claude-sonnet-5-5",llmProvider:"headless",resolved:!0,runId:"20261016-232147-seed3-target_language-58a3",promptVersion:"revise@1",createdAt:"2026-10-16T14:22:24.088Z"},verification:{status:"VERIFIED",selfAttested:!1,verifierModel:"claude-opus-5-5",verifierProvider:"headless",verifierResolved:!0,rounds:2,checks:[{id:"SCHEMA_LINT",result:"PASS"},{id:"READING_CHECK",result:"PASS"},{id:"BLIND_SOLVE",result:"PASS",note:"2/2 rounds matched"},{id:"DISTRACTOR_CHECK",result:"PASS"},{id:"QUALITY_CHECK",result:"PASS",note:"contextCues=2"},{id:"DEDUPE",result:"PASS"}],verifiedAt:"2026-10-16T14:23:50.855Z"},license:"ORIGINAL",contentHash:"d495fb34decc653976204cadd76b1a73ac3b77ec670a5bbf341855e1259f78cd"},{contentId:"q:fdlj5td7id",contentVersion:1,kind:"QUESTION",level:"N5",pool:"DIAG",tags:["katakana-lookalike","diag:KANA"],payload:{stem:"「パソコン」(컴퓨터)의 올바른 읽기는 어느 것입니까?",choices:[{id:"a",text:"ぱんこそ",whyWrong:"ソ와 ン을 서로 바꿔 읽어서 두 번째와 네 번째 글자가 모두 틀렸습니다.",howToCorrect:"두 번째 ソ는 そ, 마지막 ン은 ん입니다. ぱそこん으로 고칩니다."},{id:"b",text:"ぱそこん"},{id:"c",text:"ぱそこそ",whyWrong:"마지막 ン을 ソ로 잘못 읽었습니다.",howToCorrect:"ン은 획이 아래에서 위로 올라가는 모양이며 ん으로 읽습니다. 끝은 こん입니다."},{id:"d",text: ,license:"ORIGINAL",contentHash:"78a5d842a0b14d87d0a35d5f9673f9a7efaeedd256abdad480e300ba497d000a"},{contentId:"q:iwvbmf2wrq",contentVersion:1,kind:"QUESTION",level:"N3",pool:"DIAG",tags:["READING_DETAIL","diag:TARGET_READING"],payload:{stem:"十四日の教室に参加できなくなり、十三日の午後六時に連絡しました。どうなりますか。",choices:[{id:"a",text:"五百円かかる"},{id:"b",text:"費用はかからない",whyWrong:"연락 기한은 전날 오후 5시까지인데 오후 6시는 기한을 넘겼으므로 비용이 듭니다.",howToCorrect:"「前の日の午後五時まで」와 연락한 시각(午後六時)을 비교해 보세요."},{id:"c",text:"千円かかる",whyWrong:"본문에 1,000엔이라는 금액은 없고, 늦은 연락 시 비용은 재료비 500엔입니다.",howToCorrect:"「材料費として五百円がかかります」라는 금액 표현을 정확히 확인하세요."},{id:"d",text:"次の回に変えられる",whyWrong:"본문에는 다른 회차로 변경할 수 있다는 내용이 없습니다.",howToCorrect:"본문에 없는 내용은 고르지 말고, 연락 시각과 비용에 관한 마지막 문장만 근거로 판단하세요."}],correctChoiceId:"a",explanationKo:"마지막 문장에 전날 오후 5시까지 연락해야 하고 「それより遅いと、材料費として五百円がかかります」라고 되어 있습니다. 13일 오후 6시는 기한(오후 5시)보다 1시간 늦으므로 재료비 500엔이 듭니다.",domain:"READING_Q",scoringSection:"READING",stimulusId:"pass:mb5j76h4m3"},provenance:{origin:"AI_GENERATED",generatorModel:"claude-sonnet-5-5",llmProvider:"headless",resolved:!0,runId:"20261016-230628-seed6-target_reading-4c19",promptVersion:"revise@1",createdAt:"2026-10-16T14:06:53.742Z"},verification:{status:"VERIFIED",selfAttested:!1,verifierModel:"claude-opus-5-5",verifierProvider:"headless",verifierResolved:!0,rounds:2,checks:[{id:"SCHEMA_LINT",result:"PASS"},{id:"READING_CHECK",result:"PASS"},{id:"BLIND_SOLVE",result:"PASS",note:"2/2 rounds matched"},{id:"DISTRACTOR_CHECK",result:"PASS"},{id:"QUALITY_CHECK",result:"PASS",note:"contextCues=2"},{id:"DEDUPE",result:"PASS"}],verifiedAt:"2026-10-16T14:08:13.839Z"},license:"ORIGINAL",contentHash:"a0b4500bcea542146f0570831cd25ea55e72c0adde8402fad78c3ca6837e2ec4"},{contentId:"q:iz2unzukvl",contentVersion:1,kind:"QUESTION",level:"N5",pool:"DIAG",tags:["voiced-marks","diag:KANA"],payload:{stem:"'밥'을 뜻하는 일본어 gohan을 히라가나로 바르게 쓴 것은 어느 것입니까?",choices:[{id:"a",text:"こはん",whyWrong:"첫 글자에 탁점(゛)이 없어 go가 아니라 ko가 됩니다.",howToCorrect:"go 소리는 こ에 탁점을 붙인 ご입니다. ごはん으로 씁니다."},{id:"b",text:"ごばん",whyWrong:"두 번째 글자에 탁점이 붙어 ba가 되며, 바둑판을 뜻하는 다른 단어가 됩니다.",howToCorrect:"ha 소리는 탁점 없는 は입니다. ごはん으로 씁니다."},{id:"c",text:"ごぱん",whyWrong:"두 번째 글자에 반탁점(゜)이 붙어 pa가 되므로 gohan이 아닙니다.",howToCorrect:"ha는 は이며 반탁점은 붙이지 않습니다. ごはん으로 씁니다."},{id:"d",text:"ごはん"}],correctChoiceId:"d",explanationKo:"go는 ご(こ+탁점), ha는 は입니다. ごはん은 밥 또는 식사를 뜻합니다.",domain:"KANA",scoringSection:"LANGUAGE_KNOWLEDGE_READING"},provenance:{origin:"AI_GENERATED",generatorModel:"claude-sonnet-5-5",llmProvider:"headless",resolved:!0,runId:"20261016-225248-seed0-kana-842f",promptVersion:"revise@1",createdAt:"2026-10-16T13:53:40.419Z"},verification:{status:"VERIFIED",selfAttested:!1,verifierModel:"claude-opus-5-5",verifierProvider:"headless",verifierResolved:!0,rounds:3,checks:[{id:"SCHEMA_LINT",result:"PASS"},{id:"READING_CHECK",result:"PASS"},{id:"BLIND_SOLVE",result:"PASS",note:"2/2 rounds matched"},{id:"DISTRACTOR_CHECK",result:"PASS"},{id:"QUALITY_CHECK",result:"PASS",note:"contextCues=2"},{id:"DEDUPE",result:"PASS"}],verifiedAt:"2026-10-16T13:56:20.265Z"},license:"ORIGINAL",contentHash:"2aea75836cb306a7ffb0f120180dc1189e117a68d4aead89eddf5e8e5beab02c"},{contentId:"q:j7wo27aowc",contentVersion:1,kind:"QUESTION",level:"N4",pool:"DIAG",tags:["KO_TRANSITIVITY","KO_PARTICLE_TRANSFER","transitive-intransitive","diag:FOUNDATION"],payload:{stem:"強い風で窓が（　　）、部屋の中が寒くなりました。",choices:[{id:"a",text:"あけて",whyWrong:"「あける」는 사람이 「窓をあけて」처럼 창문을 여는 타동사입니다. 「窓が」와는 호응하지 않고, 바람이 원인이 되어 저절로 일어난 일도 나타낼 수 없습니다.",howToCorrect:"사람이 연 것이라면 「窓をあけて」라고 하고, 창문이 저절로 열린 것이라면 자동사를 써서 「窓があいて」라고 합니다."},{id:"b",text:"あけたまま",whyWrong:"타동사 「あける」의 「あけたまま」는 누군가가 열어 둔 상태를 나타내므로, 「風で窓が」처럼 저절로 일어난 변화와는 맞지 않습니다.",howToCorrect:"주어가 「窓が」라면 자동사를 써서 「窓があいたまま」라고 하거나, 사람이 주어라면 「(人が)窓をあけたまま」라고 합니다."},{id:"c",text:"あいて"},{id:"d",text:"あけさせて",whyWrong:"「あけさせる」는 사람이 다른 사람에게 시키는 사역형이라 「人に窓をあけさせる」처럼 시키는 주체(사람)와 「を」로 표시되는 목적어가 필요합니다. 그래서 「窓が」 뒤에는 문법적으로 올 수 없고, 바람 때문에 창문이 열린 상황에는 의미도 어색합니다.",howToCorrect:"바람의 작용으로 창문이 열린 것은 자동사를 써서 「窓があいて」라고 하면 자연스럽습니다."}],correctChoiceId:"c",explanationKo:"「窓が」가 주어이고 「強い風で」는 자연스러운 원인을 나타낼 뿐 문장에 행위를 하는 사람이 없으므로, 저절로 일어난 변화를 나타내는 자동사 「あく」(あいて)가 정답입니다. 「あける」는 「窓を」처럼 「を」를 취하는 타동사이므로 이 문장에 맞지 않습니다.",domain:"CONTEXT",scoringSection:"LANGUAGE_KNOWLEDGE_READING"},provenance:{origin:"AI_GENERATED",generatorModel:"claude-sonnet-5-5",llmProvider:"headless",resolved:!0,runId:"20261016-232015-seed2-foundation-91fd",promptVersion:"revise@1",createdAt:"2026-10-16T14:20:31.085Z"},verification:{status:"VERIFIED",selfAttested:!1,verifierModel:"claude-opus-5-5",verifierProvider:"headless",verifierResolved:!0,rounds:2,checks:[{id:"SCHEMA_LINT",result:"PASS"},{id:"READING_CHECK",result:"PASS"},{id:"BLIND_SOLVE",result:"PASS",note:"2/2 rounds matched"},{id:"DISTRACTOR_CHECK",result:"PASS"},{id:"QUALITY_CHECK",result:"PASS",note:"contextCues=2"},{id:"DEDUPE",result:"PASS"}],verifiedAt:"2026-10-16T14:21:47.674Z"},license:"ORIGINAL",contentHash:"8a2b5f7d4d538b6088d4d6e2051435f909a9484a910781f6660d6dfa5708bd1b"},{contentId:"q:ji6reazyyl",contentVersion:1,kind:"QUESTION",level:"N3",pool:"LEARN",tags:["GRAMMAR_NUANCE"],payload:{stem:"私はお酒は好きだが、だからといって毎日飲む＿＿。",choices:[{id:"a",text:"はずがない",whyWrong:"〜はずがない는 '~일 리가 없다'라는 강한 추측 부정이며, 본인의 습관을 설명하는 문장과 맞지 않는다.",howToCorrect:"부분 부정을 나타내는 わけではない로 바꾼다."},{id:"b",text:"ことになる",whyWrong:"〜ことになる는 결과나 결정을 나타내며, だからといって(그렇다고 해서)와 이어지는 부분 부정의 뜻이 아니다.",howToCorrect:"〜わけではない로 써서 '꼭 ~인 것은 아니다'라고 한다."},{id:"c",text:"わけではない"},{id:"d",text:"ものだ",whyWrong:"〜ものだ는 '~하는 법이다', '~하곤 했다'처럼 일반적인 이치나 감회를 나타내므로, だからといって와 이어지는 '꼭 ~인 것은 아니다'라는 부분 부정의 뜻이 되지 않는다.",howToCorrect:"뜻에 맞게 飲むわけではない로 바꾼다."}],correctChoiceId:"c",explanationKo:"お酒は好きだが、だからといって라는 흐름은 '좋아한다고 해서 매일 마시는 것은 아니다'라는 부분 부정이다. 그래서 〜わけではない가 맞다. 참고로 〜わけにはいかない는 '사정상 ~할 수 없다'는 뜻이라 이 문맥의 부분 부정과는 다르다.",domain:"GRAMMAR_FORM",scoringSection:"LANGUAGE_KNOWLEDGE",linkedContentId:"gram:xlrkblvxyb"},provenance:{origin:"AI_GENERATED",generatorModel:"claude-sonnet-5-5",llmProvider:"headless",resolved:!0,runId:"20261016-231115-seed8-learn_grammar-63bd", }],verifiedAt:"2026-10-16T14:02:38.663Z"},license:"ORIGINAL",contentHash:"dbafeaa57638ff7d94946f3fe64f509cdefb8a79831b5a60bc69b71c04f8826b"},{contentId:"q:kevocvye6x",contentVersion:1,kind:"QUESTION",level:"N3",pool:"DIAG",tags:["KO_FALSE_FRIEND","工夫","diag:TARGET_LANGUAGE"],payload:{stem:"毎日同じやり方では続かないので、少し（　）して、ゲームのように楽しみながら単語を覚えることにした。",choices:[{id:"a",text:"勉強",whyWrong:"勉強는 배우는 행위 자체를 뜻하며, 방법을 궁리한다는 의미가 없습니다. 한국어 '공부'에 해당하는 말이라 함정이 되기 쉽습니다.",howToCorrect:"방법을 궁리한다는 뜻은 「工夫する」로 나타내고, 「勉強する」는 「単語を勉強する」처럼 배우는 내용과 함께 씁니다."},{id:"b",text:"工夫"},{id:"c",text:"練習",whyWrong:"練習는 같은 것을 반복해서 실력을 높인다는 뜻이라, 방법을 바꿔 즐겁게 만든다는 문맥에는 맞지 않습니다.",howToCorrect:"「毎日ピアノを練習する」처럼 반복해서 익히는 행위에 쓰고, 방법을 궁리할 때는 「工夫する」를 씁니다."},{id:"d",text:"苦労",whyWrong:"苦労는 힘들고 고생한다는 뜻이라 '게임처럼 즐기며'라는 긍정적인 흐름과 맞지 않습니다.",howToCorrect:"「苦労して覚えた」처럼 힘든 정도를 나타낼 때 쓰고, 여기서는 「工夫して」가 알맞습니다."}],correctChoiceId:"b",explanationKo:"한자가 같은 工夫(くふう)는 한국어 '공부'와 달리 '방법을 궁리하다'라는 뜻입니다. 한국어의 '공부'에 해당하는 일본어는 勉強(べんきょう)이며, 이것이 선택지 a의 함정입니다. 매일 같은 방식으로는 이어가기 어려워서 게임처럼 바꾼다는 문맥에는 工夫가 맞습니다.",domain:"CONTEXT",scoringSection:"LANGUAGE_KNOWLEDGE"},provenance:{origin:"AI_GENERATED",generatorModel:"claude-sonnet-5-5",llmProvider:"headless",resolved:!0,runId:"20261016-230249-seed4-target_language-356c",promptVersion:"revise@1",createdAt:"2026-10-16T14:03:21.451Z"},verification:{status:"VERIFIED",selfAttested:!1,verifierModel:"claude-opus-5-5",verifierProvider:"headless",verifierResolved:!0,rounds:2,checks:[{id:"SCHEMA_LINT",result:"PASS"},{id:"READING_CHECK",result:"PASS"},{id:"BLIND_SOLVE",result:"PASS",note:"2/2 rounds matched"},{id:"DISTRACTOR_CHECK",result:"PASS"},{id:"QUALITY_CHECK",result:"PASS",note:"contextCues=2"},{id:"DEDUPE",result:"PASS"}],verifiedAt:"2026-10-16T14:04:41.754Z"},license:"ORIGINAL",contentHash:"538a6831c35e8db524f1a76eaec37a4076bfe9ba141b2acd4e69fe95dc6805d7"},{contentId:"q:n5wbv5nmrv",contentVersion:1,kind:"QUESTION",level:"N3",pool:"DIAG",tags:["都合","コロケーション","diag:TARGET_LANGUAGE"],payload:{stem:"急な仕事が入って、明日は（　）が悪くなったので、午後の会議には出られません。申し訳ありません。",choices:[{id:"a",text:"機会",whyWrong:"「機会」는 '기회'라는 뜻으로 「機会が悪い」라고는 하지 않으며, 참석하지 못하는 이유로 어색합니다.",howToCorrect:"「機会があれば」「いい機会」처럼 쓰는 말이므로, 여기서는 「都合が悪い」로 고쳐야 합니다."},{id:"b",text:"予定",whyWrong:"「予定が悪い」라고는 하지 않으며, 「予定がある」「予定が入っている」처럼 씁니다.",howToCorrect:"「予定があって出られません」이라고는 말할 수 있지만, 「悪い」와 어울리게 하려면 「都合が悪い」로 고칩니다."},{id:"c",text:"時間",whyWrong:"「時間が悪い」는 자연스러운 표현이 아니며, 시간과 관련해서는 「時間がない」「時間が合わない」처럼 씁니다. 또한 여기서 필요한 개인의 사정이나 형편(참석 가능 여부)을 나타내지도 못합니다.",howToCorrect:"「時間がない」「時間が合わない」처럼 말하거나, 개인 사정을 나타내는 「都合が悪い」를 사용합니다."},{id:"d",text:"都合"}],correctChoiceId:"d",explanationKo:"'都合が悪い'는 '사정이 안 좋다, 형편이 안 된다'라는 뜻으로, 본인이 시간을 내거나 참석할 수 있는지를 나타내는 자주 쓰는 표현입니다. 「〜が悪くなった」라는 호응과 뒤의 「会議には出られません／申し訳ありません」이라는 결과가 모두 개인의 사정을 가리키므로 都合가 알맞습니다. 관련 표현으로 '都合がいい'(사정이 좋다, 형편이 맞다), '都合がつく'(시간을 낼 수 있다)도 함께 알아 두세요.",domain:"CONTEXT",scoringSection:"LANGUAGE_KNOWLEDGE"},provenance:{origin:"AI_GENERATED",generatorModel:"claude-sonnet-5-5",llmProvider:"headless",resolved:!0,runId:"20261016-230249-seed4-target_language-356c",promptVersion:"revise@1",createdAt:"2026-10-16T14:03:21.452Z"},verification:{status:"VERIFIED",selfAttested:!1,verifierModel:"claude-opus-5-5",verifierProvider:"headless",verifierResolved:!0,rounds:3,checks:[{id:"SCHEMA_LINT",result:"PASS"},{id:"READING_CHECK",result:"PASS"},{id:"BLIND_SOLVE",result:"PASS",note:"2/2 rounds matched"},{id:"DISTRACTOR_CHECK",result:"PASS"},{id:"QUALITY_CHECK",result:"PASS",note:"contextCues=3"},{id:"DEDUPE",result:"PASS"}],verifiedAt:"2026-10-16T14:05:27.053Z"},license:"ORIGINAL",contentHash:"14a255cad9370fc7de29ab30c1fe3989619cba765c9ef847e235c94d4f1d1376"},{contentId:"q:ogesningz4",contentVersion:1,kind:"QUESTION",level:"N3",pool:"LEARN",tags:["GRAMMAR_NUANCE"],payload:{stem:"昨日は電車が遅れた＿＿、大事な会議に間に合わなかった。",choices:[{id:"a",text:"せいで"},{id:"b",text:"おかげで",whyWrong:"〜おかげで는 좋은 결과에 감사하는 뉘앙스로 쓴다. 회의에 늦은 나쁜 결과와는 어울리지 않는다.",howToCorrect:"나쁜 결과의 원인이므로 遅れたせいで로 바꾼다."},{id:"c",text:"くせに",whyWrong:"〜くせに는 '~인데도'라는 비난의 뜻으로, 주로 사람의 태도를 '~인 주제에'라고 나무랄 때 쓴다. 電車처럼 사람이 아닌 주어가 원인을 말하는 문장에는 어울리지 않으며, 전철이 늦은 것과 회의에 늦은 것 사이의 원인 관계도 나타내지 못한다.",howToCorrect:"원인을 나타내는 せいで로 바꾼다."},{id:"d",text:"ように",whyWrong:'〜ように는 목적·바람이나 "~처럼"(비유·예시)을 나타내며, 원인을 나타내지 못한다.',howToCorrect:"과거의 나쁜 원인을 말하는 遅れたせいで로 바꾼다."}],correctChoiceId:"a",explanationKo:"전철이 늦은 것이 원인이 되어 회의 시간에 맞추지 못한 나쁜 결과가 생겼으므로 〜せいで를 쓴다. おかげで는 좋은 결과에 쓴다.",domain:"GRAMMAR_FORM",scoringSection:"LANGUAGE_KNOWLEDGE",linkedContentId:"gram:hbubbgm6n3"},provenance:{origin:"AI_GENERATED",generatorModel:"claude-sonnet-5-5",llmProvider:"headless",resolved:!0,runId:"20261016-231115-seed8-learn_grammar-63bd",promptVersion:"revise@1",createdAt:"2026-10-16T14:11:56.590Z"},verification:{status:"VERIFIED",selfAttested:!1,verifierModel:"claude-opus-5-5",verifierProvider:"headless",verifierResolved:!0,rounds:2,checks:[{id:"SCHEMA_LINT",result:"PASS"},{id:"READING_CHECK",result:"PASS"},{id:"BLIND_SOLVE",result:"PASS",note:"2/2 rounds matched"},{id:"DISTRACTOR_CHECK",result:"PASS"},{id:"QUALITY_CHECK",result:"PASS",note:"contextCues=2"},{id:"DEDUPE",result:"PASS"}],verifiedAt:"2026-10-16T14:14:35.387Z"},license:"ORIGINAL",contentHash:"cf879ab447b3c6480885f9589bc2527f1f586bb7b7b7c1fdb3c1ae2af73f1750"},{contentId:"q:q5jcekbbyk",contentVersion:1,kind:"QUESTION",level:"N3",pool:"LEARN",tags:["GRAMMAR_NUANCE"],payload:{stem:"医者に言われたわけではないが、健康のために来月から毎朝公園を走る＿＿。",choices:[{id:"a",text:"ことになった",whyWrong:"〜ことになった는 어떤 일을 상황이나 다른 사람에 의해 정해진 것으로 제시하는 표현이며, 본인의 의지로 정했다는 뜻이 아니다. 이 문장에서는 医者に言われたわけではない와 健康のために라는 단서 때문에 화자가 스스로 정했다는 것이 분명하므로 ことにした가 가장 적절하다.",howToCorrect:"본인의 결정을 나타내는 〜ことにした로 바꾼다."},{id:"b",text:"ことにした"},{id:"c",text:"ようになった",whyWrong:"〜ようになった는 능력이나 습관 등 이미 일어난 변화를 나타내므로, 앞으로의 계획을 나타내는 来月から(다음 달부터)와 맞지 않는다.",howToCorrect:"결정을 나타내려면 走ることにした로 쓴다."},{id:"d",text:"ところだった",whyWrong:"〜ところだった는 '하마터면 ~할 뻔했다'라는 뜻이라 来月から(다음 달부터)라는 계획과 맞지 않는다.",howToCorrect:"계획을 정했다는 뜻이므로 走ることにした로 바꾼다."}],correctChoiceId:"b",explanationKo:"〜ことになった는 어떤 일이 상황이나 다른 사람에 의해 정해진 것으로 제시하는 표현이며, 본인의 의지로 정했다는 뜻이 아니다. 이 문장에서는 医者に言われたわけではない와 健康のために라는 단서로 보아 화자가 스스로 정했음을 알 수 있으므로 〜ことにした가 가장 적절하다.",domain:"GRAMMAR_FORM",scoringSection:"LANGUAGE_KNOWLEDGE",linkedContentId:"gram:5y2zmzsvc3"},provenance:{origin:"AI_GENERATED",generatorModel:"claude-sonnet-5-5",llmProvider:"headless",resolved:!0,runId:"20261016-231115-seed8-learn_grammar-63bd",promptVersion:"revise@1",createdAt:"2026-10-16T14:11:56.590Z"},verification:{status:"VERIFIED",selfAttested:!1,verifierModel:"claude-opus-5-5",verifierProvider:"headless",verifierResolved:!0,rounds:2,checks:[{id:"SCHEMA_LINT",result:"PASS"},{id:"READING_CHECK",result:"PASS"},{id:"BLIND_SOLVE",result:"PASS",note:"2/2 rounds matched"},{id:"DISTRACTOR_CHECK",result:"PASS"},{id:"QUALITY_CHECK",result:"PASS",note:"contextCues=2"},{id:"DEDUPE",result:"PASS"}],verifiedAt:"2026-10-16T14:15:40.154Z"},license:"ORIGINAL",contentHash:"24355f893b1600d8a33d0e85e5e7d3999474b92bf0a514e82271a81f42ea7532"},{contentId:"q:qfzvxkv6fp",contentVersion:1,kind:"QUESTION",level:"N5",pool:"DIAG",tags:["LONG_VOWEL","CHOONPU","katakana-lookalike","diag:KANA"],payload:{stem:"「シーツ」(침대 시트)의 올바른 읽기는 어느 것입니까?",choices:[{id:"a",text:"しーつ"},{id:"b",text:"つーし",whyWrong:"シ와 ツ의 순서를 거꾸로 읽은 것으로, 「シーツ」는 처음이 シ, 끝이 ツ입니다.",howToCorrect:"シ는 짧은 두 점이 왼쪽에 위아래로 놓이고 긴 획이 왼쪽 아래에서 오른쪽 위로 올라갑니다. ツ는 짧은 두 점이 위쪽에 나란히 놓이고 긴 획이 오른쪽 위에서 왼쪽 아래로 내려옵니다. 따라서 「シーツ」는 しーつ입니다."},{id:"c",text:"しーし",whyWrong:"끝 글자 ツ를 シ로 잘못 읽었습니다.",howToCorrect:"ツ는 두 점이 위쪽에 나란히 놓이고 긴 획이 오른쪽 위에서 왼쪽 아래로 내려옵니다. 그래서 끝 글자는 つ로 읽어 しーつ로 고칩니다."},{id:"d",text:"つーつ",whyWrong:"첫 글자 シ를 ツ로 잘못 읽었습니다.",howToCorrect:"シ는 짧은 두 점이 왼쪽에 위아래로 놓이고 긴 획이 왼쪽 아래에서 오른쪽 위로 올라갑니다. 첫 글자는 し이므로 しーつ입니다."}],correctChoiceId:"a",explanationKo:"シ는 し, ツ는 つ로 읽습니다. シ와 ツ는 점의 위치와 획의 방향으로 구별합니다. シ는 두 점이 왼쪽에 위아래로 놓이고 긴 획이 왼쪽 아래에서 오른쪽 위로 올라가며, ツ는 두 점이 위쪽에 나란히 놓이고 긴 획이 오른쪽 위에서 왼쪽 아래로 내려옵니다. 「シーツ」는 しーつ이며 가운데 ー는 앞 모음을 길게 늘이는 표시입니다.",domain:"KANA",scoringSection:"LANGUAGE_KNOWLEDGE_READING"},provenance:{origin:"AI_GENERATED",generatorModel:"claude-sonnet-5-5",llmProvider:"headless",resolved:!0,runId:"20261016-225248-seed0-kana-842f",promptVersion:"revise@1",createdAt:"2026-10-16T13:53:40.417Z"},verification:{status:"VERIFIED",selfAttested:!1,verifierModel:"claude-opus-5-5",verifierProvider:"headless",verifierResolved:!0,rounds:2,checks:[{id:"SCHEMA_LINT",result:"PASS"},{id:"READING_CHECK",result:"PASS"},{id:"BLIND_SOLVE",result:"PASS",note:"2/2 rounds matched"},{id:"DISTRACTOR_CHECK",result:"PASS"},{id:"QUALITY_CHECK",result:"PASS",note:"contextCues=0"},{id:"DEDUPE",result:"PASS"}],verifiedAt:"2026-10-16T13:56:00.422Z"},license:"ORIGINAL",contentHash:"976511915a5d791d3c4f447e21b87586a9c04fa29bf89357254f64aae1f71f9e"},{contentId:"q:rrugm3nmij",contentVersion:1,kind:"QUESTION",level:"N3",pool:"DIAG",tags:["diag:TARGET_READING"],payload:{stem:"参加する人が自分で持っていかなければならないものは何ですか。",choices:[{id:"a",text:"材料",whyWrong:"참가비에 재료비가 포함되어 있으므로 재료는 따로 가져갈 필요가 없습니다.",howToCorrect:"「材料費も入っています」라는 문장을 근거로 제외하세요."},{id:"b",text:"申し込み用紙",whyWrong:"본문에 신청 용지를 가져오라는 언급은 없습니다.",howToCorrect:"「持ってきてください」 앞에 나온 물건은 エプロン과 タオル뿐임을 확인하세요."},{id:"c",text:"調理道具",whyWrong:"조리 도구를 가져오라는 언급은 본문에 없습니다.",howToCorrect:"본문에 나온 지참물은 エプロン과 タオル뿐임을 확인하세요."},{id:"d",text:"エプロンとタオル"}],correctChoiceId:"d",explanationKo:"본문에 「エプロンとタオルは自分で持ってきてください」라고 되어 있으므로 앞치마와 수건이 정답입니다. 재료는 「材料費も入っています」라고 되어 있어 참가비에 포함됩니다.",domain:"READING_Q",scoringSection:"READING",stimulusId:"pass:mb5j76h4m3"},provenance:{origin:"AI_GENERATED",generatorModel:"claude-sonnet-5-5",llmProvider:"headless",resolved:!0,runId:"20261016-230628-seed6-target_reading-4c19",promptVersion:"revise@1",createdAt:"2026-10-16T14:06:53.742Z"},verification:{status:"VERIFIED",selfAttested:!1,verifierModel:"claude-opus-5-5",verifierProvider:"headless",verifierResolved:!0,rounds:2,checks:[{id:"SCHEMA_LINT",result:"PASS"},{id:"READING_CHECK",result:"PASS"},{id:"BLIND_SOLVE",result:"PASS",note:"2/2 rounds matched"},{id:"DISTRACTOR_CHECK",result:"PASS"},{id:"QUALITY_CHECK",result:"PASS",note:"contextCues=2"},{id:"DEDUPE",result:"PASS"}],verifiedAt:"2026-10-16T14:09:25.863Z"},license:"ORIGINAL",contentHash:"606f1470dd18435b61afa831d0caad9f976c2d5c6a4a391151427b771699ad11"},{contentId:"q:rvonrxvdq6",contentVersion:1,kind:"QUESTION",level:"N5",pool:"DIAG",tags:["SOKUON_YOON","diag:KANA"],payload:{stem:"kitte(우표)를 히라가나로 바르게 쓴 것은 어느 것입니까?",choices:[{id:"a",text:"きて",whyWrong:"촉음 っ이 빠져서 '와서'라는 뜻의 다른 말(来て)이 됩니다.",howToCorrect:"kitte처럼 자음이 겹치면 작은 っ을 넣어 きって로 씁니다."},{id:"b",text:"きっと",whyWrong:"끝 글자가 と여서 kitto(꼭, 틀림없이)라는 다른 단어가 됩니다.",howToCorrect:"끝 소리는 te이므로 て를 써서 きって로 씁니다."},{id:"c",text:"きって"},{id:"d",text:"きつて",whyWrong:"촉음 자리에 큰 つ를 써서 kitsute로 읽히게 됩니다.",howToCorrect:"촉음은 작게 쓴 っ으로 나타내 きって로 씁니다."}],correctChoiceId:"c",explanationKo:"작은 っ은 뒤의 자음을 겹쳐 한 박자 쉬게 하는 촉음입니다. 「きって」는 우표를 뜻합니다.",domain:"KANA",scoringSection:"LANGUAGE_KNOWLEDGE_READING"},provenance:{origin:"AI_GENERATED",generatorModel:"claude-sonnet-5-5",llmProvider:"headless",resolved:!0,runId:"20261016-225248-seed0-kana-842f",promptVersion:"gen_question@1,_common@1",createdAt:"2026-10-16T13:53:40.420Z"},verification:{status:"VERIFIED",selfAttested:!1,verifierModel:"claude-opus-5-5",verifierProvider:"headless",verifierResolved:!0,rounds:1,checks:[{id:"SCHEMA_LINT",result:"PASS"},{id:"READING_CHECK",result:"PASS"},{id:"BLIND_SOLVE",result:"PASS",note:"2/2 rounds matched"},{id:"DISTRACTOR_CHECK",result:"PASS"},{id:"QUALITY_CHECK",result:"PASS",note:"contextCues=0"},{id:"DEDUPE",result:"PASS"}],verifiedAt:"2026-10-16T13:56:30.757Z"},license:"ORIGINAL",contentHash:"b5fc8d6452831882e5c4fbc934c86e7f3cc4d8b0c3293c8e07523fc6401fce53"},{contentId:"q:rvzxxhdvus",contentVersion:1,kind:"QUESTION",level:"N3",pool:"DIAG",tags:["GRAMMAR_NUANCE","うちに","diag:TARGET_LANGUAGE"],payload:{stem:"雨が降り出さない( )、急いで洗濯物を取り込んだ。",choices:[{id:"a",text:"かぎり",whyWrong:"「ないかぎり」는 「~하지 않는 한」이라는 조건을 나타내므로, 과거의 1회성 행동 「取り込んだ」와 이어지면 부자연스럽습니다.",howToCorrect:"「雨が降り出さないかぎり、洗濯物は外に干しておける」(비가 내리기 시작하지 않는 한 빨래는 밖에 널어 둘 수 있다)처럼 조건과 그 상태가 계속되는 문장에서 사용합니다."},{id:"b",text:"うちに"},{id:"c",text:"ばかりに",whyWrong:"「ばかりに」는 「~때문에 나쁜 결과가 되었다」라는 의미인데, 「降り出さない」와 「取り込んだ」 사이에는 그런 원인과 결과의 관계가 없습니다.",howToCorrect:"「急いでいたばかりに、傘を忘れた」(서두른 탓에 우산을 깜빡했다)처럼 원인이 나쁜 결과를 불러온 문장에서 사용합니다."},{id:"d",text:"ままに",whyWrong:"「ままに」는 「~한 상태 그대로, ~에 따라」라는 뜻입니다. 이 문장에서는 「상태가 바뀌기 전에」라는 의미가 필요한데, 「ままに」는 상태가 유지된 채 따르는 의미라서 맞지 않습니다.",howToCorrect:"「言われるままに書類にサインした」(시키는 대로 서류에 서명했다)처럼 다른 사람의 말이나 흐름을 그대로 따르는 문장에서 사용합니다."}],correctChoiceId:"b",explanationKo:"「V-ないうちに」는 「(상태가 바뀌기) 전에 ~하다」라는 뜻입니다. 비가 내리기 시작하기 전에 서둘러 빨래를 걷었다는 흐름에 맞습니다. 또한 「急いで」가 상태가 바뀌기 전에 행동한다는 의미를 뒷받침합니다.",domain:"GRAMMAR_FORM",scoringSection:"LANGUAGE_KNOWLEDGE"},provenance:{origin:"AI_GENERATED",generatorModel:"claude-sonnet-5-5",llmProvider:"headless",resolved:!0,runId:"20261016-232147-seed3-target_language-58a3",promptVersion:"revise@1",createdAt:"2026-10-16T14:22:24.087Z"},verification:{status:"VERIFIED",selfAttested:!1,verifierModel:"claude-opus-5-5",verifierProvider:"headless",verifierResolved:!0,rounds:2,checks:[{id:"SCHEMA_LINT",result:"PASS"},{id:"READING_CHECK",result:"PASS"},{id:"BLIND_SOLVE",result:"PASS",note:"2/2 rounds matched"},{id:"DISTRACTOR_CHECK",result:"PASS"},{id:"QUALITY_CHECK",result:"PASS",note:"contextCues=2"},{id:"DEDUPE",result:"PASS"}],verifiedAt:"2026-10-16T14:25:08.588Z"},license:"ORIGINAL",contentHash:"3ff85442c193f31f8a73179538123e34e70cf411f88688b8c5eaca704542774c"},{contentId:"q:sfphb6sitn",contentVersion:1,kind:"QUESTION",level:"N3",pool:"DIAG",tags:["迷惑","コロケーション","diag:TARGET_LANGUAGE"],payload:{stem:"電車の中で大きな声で電話をしてしまい、周りの乗客に（　）をかけたと反省した。",choices:[{id:"a",text:"遠慮",whyWrong:"'遠慮'는 사양하다·삼가다라는 뜻으로 '遠慮をかける'라는 표현은 없으며, 'かける'의 대상이 되지도 않습니다.",howToCorrect:"'遠慮する', '遠慮なく' 형태로 쓰며, 이 문장에서는 '迷惑をかけた'가 맞습니다."},{id:"b",text:"失礼",whyWrong:"'失礼をかける'는 자연스러운 연어(collocation)가 아닙니다. '失礼'는 '失礼をする', '失礼なことをした'처럼 쓰며, 남에게 폐를 끼친다는 뜻으로는 '迷惑をかける'가 표준적인 표현입니다.",howToCorrect:"'失礼なことをした'로 바꿔 말하거나, 'かける'와 어울리는 '迷惑'를 사용합니다."},{id:"c",text:"迷惑"},{id:"d",text:"注意",whyWrong:"'注意'는 '注意をする', '注意を受ける'처럼 쓰며 '注意をかける'라고는 하지 않습니다. 또한 반성하는 내용과도 맞지 않습니다.",howToCorrect:"'注意された'(주의를 받았다)라고 말할 수는 있지만, '〜をかける' 형태로 쓸 때는 '迷惑をかける'를 사용합니다."}],correctChoiceId:"c",explanationKo:"'迷惑をかける'는 남에게 폐를 끼친다는 뜻의 정해진 표현입니다. 공손하게 말할 때는 'ご迷惑をおかけする'를 씁니다. 전철에서 큰 소리로 통화한 상황과 '周りの乗客に〜をかけた'라는 구조가 모두 '迷惑'를 가리킵니다.",domain:"CONTEXT",scoringSection:"LANGUAGE_KNOWLEDGE"},provenance:{origin:"AI_GENERATED",generatorModel:"claude-sonnet-5-5",llmProvider:"headless",resolved:!0,runId:"20261016-230249-seed4-target_language-356c",promptVersion:"revise@1",createdAt:"2026-10-16T14:03:21.452Z"},verification:{status:"VERIFIED",selfAttested:!1,verifierModel:"claude-opus-5-5",verifierProvider:"headless",verifierResolved:!0,rounds:2,checks:[{id:"SCHEMA_LINT",result:"PASS"},{id:"READING_CHECK",result:"PASS"},{id:"BLIND_SOLVE",result:"PASS",note:"2/2 rounds matched"},{id:"DISTRACTOR_CHECK",result:"PASS"},{id:"QUALITY_CHECK",result:"PASS",note:"contextCues=3"},{id:"DEDUPE",result:"PASS"}],verifiedAt:"2026-10-16T14:06:11.039Z"},license:"ORIGINAL",contentHash:"e82b398608b133d065b53c7d2d2357ca4f7b1438ec103ce42db10ea02bff2876"},{contentId:"q:vstd66s33z",contentVersion:1,kind:"QUESTION",level:"N5",pool:"DIAG",tags:["KO_PARTICLE_TRANSFER","particles","と","diag:FOUNDATION"],payload:{stem:"日曜日に 友だち（　）いっしょに えいがを 見に いきます。",choices:[{id:"a",text:"に",whyWrong:"「に」는 동작이 향하는 대상(예: 友だちに あいます)이나 시간을 나타내므로, 함께 가는 사람에는 쓸 수 없습니다.",howToCorrect:"함께 가는 사람은 「と」로 나타내어 「友だちと いっしょに」라고 합니다."},{id:"b",text:"を",whyWrong:"「を」는 동작의 대상(목적어)을 나타내는데, 이 문장의 목적어는 이미 「えいがを」이고 친구는 대상이 아닙니다.",howToCorrect:"함께 가는 사람이므로 「友だちと いっしょに」라고 합니다."},{id:"c",text:"と"},{id:"d",text:"で",whyWrong:"「で」는 장소·수단·재료를 나타내며, 「みんなで」「ふたりで」처럼 인원수를 나타낼 수는 있지만 「友だちで」처럼 함께하는 상대를 나타낼 수는 없습니다.",howToCorrect:"함께 가는 상대는 「と」로 나타내어 「友だちと いっしょに えいがを 見に いきます」라고 합니다."}],correctChoiceId:"c",explanationKo:"「いっしょに」가 있고 친구는 함께 영화를 보러 가는 사람이므로 동반자를 나타내는 「と」(~와/과)를 씁니다. 목적어는 이미 「えいがを」이므로 「を」는 들어갈 수 없고, 「に」「で」도 함께하는 사람을 나타내지 못합니다.",domain:"GRAMMAR_FORM",scoringSection:"LANGUAGE_KNOWLEDGE_READING"},provenance:{origin:"AI_GENERATED",gene
