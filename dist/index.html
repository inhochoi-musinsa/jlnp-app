는 ために에 대응하는데, '~기 위해'에서 연상해 ために를 고르기 쉬우므로 주의해야 합니다.",domain:"GRAMMAR_FORM",scoringSection:"LANGUAGE_KNOWLEDGE"},provenance:{origin:"AI_GENERATED",generatorModel:"claude-sonnet-5-5",llmProvider:"headless",resolved:!0,runId:"20261016-232508-seed3-target_language-fad0",promptVersion:"revise@1",createdAt:"2026-10-16T14:25:22.300Z"},verification:{status:"VERIFIED",selfAttested:!1,verifierModel:"claude-opus-5-5",verifierProvider:"headless",verifierResolved:!0,rounds:3,checks:[{id:"SCHEMA_LINT",result:"PASS"},{id:"READING_CHECK",result:"PASS"},{id:"BLIND_SOLVE",result:"PASS",note:"2/2 rounds matched"},{id:"DISTRACTOR_CHECK",result:"PASS"},{id:"QUALITY_CHECK",result:"PASS",note:"contextCues=3"},{id:"DEDUPE",result:"PASS"}],verifiedAt:"2026-10-16T14:27:43.434Z"},license:"ORIGINAL",contentHash:"cf59accd7bf099a7bc0eb69778018bb5179905b984278e707f171b49968ab18a"},{contentId:"q:33t6ougt6r",contentVersion:1,kind:"QUESTION",level:"N4",pool:"DIAG",tags:["KO_TRANSITIVITY","transitive-intransitive","diag:FOUNDATION"],payload:{stem:"きのうは風が強くて、窓が（　）、部屋がとても寒くなりました。",choices:[{id:"a",text:"開けて",whyWrong:"「開ける」는 사람이 무언가를 여는 타동사이므로, 바람 때문에 창문이 저절로 열린 상황(「窓が」)에는 맞지 않습니다.",howToCorrect:"자동사를 써서 「窓が開いて」로 고칩니다. 사람이 연 경우라면 「窓を開けて」가 됩니다."},{id:"b",text:"開いて"},{id:"c",text:"閉めて",whyWrong:"「閉める」는 사람이 창문을 닫는 타동사이고, 창문을 닫으면 추위를 막을 수 있으므로 방이 매우 추워졌다는 결과와 의미가 맞지 않습니다.",howToCorrect:"방이 추워진 원인은 창문이 열린 것이므로 「窓が開いて」로 고칩니다."},{id:"d",text:"閉まって",whyWrong:"「閉まる」는 자동사이므로 동사의 종류는 맞지만, 창문이 닫히면 방이 추워지지 않으므로 문맥상 의미가 맞지 않습니다.",howToCorrect:"방이 추워지는 원인으로 자연스러운 「開いて」로 고칩니다."}],correctChoiceId:"b",explanationKo:"「窓が」가 주어이고 바람이 원인이므로, 사람의 행위가 없는 자동사 「開く」를 써야 합니다. 「開けて」는 사람이 의도적으로 여는 타동사이므로 맞지 않습니다. 「閉めて」는 사람이 닫는 타동사이고, 「閉まって」는 자동사로 동사의 종류는 맞지만 창문이 닫히는 의미라서 방이 추워진 결과와 맞지 않습니다. 따라서 정답은 「開いて」(あいて)입니다.",domain:"CONTEXT",scoringSection:"LANGUAGE_KNOWLEDGE_READING"},provenance:{origin:"AI_GENERATED",generatorModel:"claude-sonnet-5-5",llmProvider:"headless",resolved:!0,runId:"20261016-225933-seed2-foundation-2d90",promptVer 悪くなったので、午後の会議には出られません。申し訳ありません。",choices:[{id:"a",text:"機会",whyWrong:"「機会」는 '기회'라는 뜻으로 「機会が悪い」라고는 하지 않으며, 참석하지 못하는 이유로 어색합니다.",howToCorrect:"「機会があれば」「いい機会」처럼 쓰는 말이므로, 여기서는 「都合が悪い」로 고쳐야 합니다."},{id:"b",text:"予定",whyWrong:"「予定が悪い」라고는 하지 않으며, 「予定がある」「予定が入っている」처럼 씁니다.",howToCorrect:"「予定があって出られません」이라고는 말할 수 있지만, 「悪い」와 어울리게 하려면 「都合が悪い」로 고칩니다."},{id:"c",text:"時間",whyWrong:"「時間が悪い」는 자연스러운 표현이 아니며, 시간과 관련해서는 「時間がない」「時間が合わない」처럼 씁니다. 또한 여기서 필요한 개인의 사정이나 형편(참석 가능 여부)을 나타내지도 못합니다.",howToCorrect:"「時間がない」「時間が合わない」처럼 말하거나, 개인 사정을 나타내는 「都合が悪い」를 사용합니다."},{id:"d",text:"都合"}],correctChoiceId:"d",explanationKo:"'都合が悪い'는 '사정이 안 좋다, 형편이 안 된다'라는 뜻으로, 본인이 시간을 내거나 참석할 수 있는지를 나타내는 자주 쓰는 표현입니다. 「〜が悪くなった」라는 호응과 뒤의 「会議には出られません／申し訳ありません」이라는 결과가 모두 개인의 사정을 가리키므로 都合가 알맞습니다. 관련 표현으로 '都合がいい'(사정이 좋다, 형편이 맞다), '都合がつく'(시간을 낼 수 있다)도 함께 알아 두세요.",domain:"CONTEXT",scoringSection:"LANGUAGE_KNOWLEDGE"},provenance:{origin:"AI_GENERATED",generatorModel:"claude-sonnet-5-5",llmProvider:"headless",resolved:!0,runId:"20261016-230249-seed4-target_language-356c",promptVersion:"revise@1",createdAt:"2026-10-16T14:03:21.452Z"},verification:{status:"VERIFIED",selfAttested:!1,verifierModel:"claude-opus-5-5",verifierProvider:"headless",verifierResolved:!0,rounds:3,checks:[{id:"SCHEMA_LINT",result:"PASS"},{id:"READING_CHECK",result:"PASS"},{id:"BLIND_SOLVE",result:"PASS",note:"2/2 rounds matched"},{id:"DISTRACTOR_CHECK",result:"PASS"},{id:"QUALITY_CHECK",result:"PASS",note:"contextCues=3"},{id:"DEDUPE",result:"PASS"}],verifiedAt:"2026-10-16T14:05:27.053Z"},license:"ORIGINAL",contentHash:"14a255cad9370fc7de29ab30c1fe3989619cba765c9ef847e235c94d4f1d1376"},{contentId:"q:ogesningz4",contentVersion:1,kind:"QUESTION",level:"N3",pool:"LEARN",tags:["GRAMMAR_NUANCE"],payload:{stem:"昨日は電車が遅れた＿＿、大事な会議に間に合わなかった。",choices:[{id:"a",text:"せいで"},{id:"b",text:"おかげで",whyWrong:"〜おかげで는 좋은 결과에 감사하는 뉘앙스로 쓴다. 회의에 늦은 나쁜 결과와는 어울리지 않는다.",howToCorrect:"나쁜 결과의 원인이므로 遅れたせいで로 바꾼다."},{id:"c",text:"くせに",whyWrong:"〜くせに는 '~인데도'라는 비난의 뜻으로, 주로 사람의 태도를 '~인 주제에' "「ばかりに」는 「~때문에 나쁜 결과가 되었다」라는 의미인데, 「降り出さない」와 「取り込んだ」 사이에는 그런 원인과 결과의 관계가 없습니다.",howToCorrect:"「急いでいたばかりに、傘を忘れた」(서두른 탓에 우산을 깜빡했다)처럼 원인이 나쁜 결과를 불러온 문장에서 사용합니다."},{id:"d",text:"ままに",whyWrong:"「ままに」는 「~한 상태 그대로, ~에 따라」라는 뜻입니다. 이 문장에서는 「상태가 바뀌기 전에」라는 의미가 필요한데, 「ままに」는 상태가 유지된 채 따르는 의미라서 맞지 않습니다.",howToCorrect:"「言われるままに書類にサインした」(시키는 대로 서류에 서명했다)처럼 다른 사람의 말이나 흐름을 그대로 따르는 문장에서 사용합니다."}],correctChoiceId:"b",explanationKo:"「V-ないうちに」는 「(상태가 바뀌기) 전에 ~하다」라는 뜻입니다. 비가 내리기 시작하기 전에 서둘러 빨래를 걷었다는 흐름에 맞습니다. 또한 「急いで」가 상태가 바뀌기 전에 행동한다는 의미를 뒷받침합니다.",domain:"GRAMMAR_FORM",scoringSection:"LANGUAGE_KNOWLEDGE"},provenance:{origin:"AI_GENERATED",generatorModel:"claude-sonnet-5-5",llmProvider:"headless",resolved:!0,runId:"20261016-232147-seed3-target_language-58a3",promptVersion:"revise@1",createdAt:"2026-10-16T14:22:24.087Z"},verification:{status:"VERIFIED",selfAttested:!1,verifierModel:"claude-opus-5-5",verifierProvider:"headless",verifierResolved:!0,rounds:2,checks:[{id:"SCHEMA_LINT",result:"PASS"},{id:"READING_CHECK",result:"PASS"},{id:"BLIND_SOLVE",result:"PASS",note:"2/2 rounds matched"},{id:"DISTRACTOR_CHECK",result:"PASS"},{id:"QUALITY_CHECK",result:"PASS",note:"contextCues=2"},{id:"DEDUPE",result:"PASS"}],verifiedAt:"2026-10-16T14:25:08.588Z"},license:"ORIGINAL",contentHash:"3ff85442c193f31f8a73179538123e34e70cf411f88688b8c5eaca704542774c"},{contentId:"q:sfphb6sitn",contentVersion:1,kind:"QUESTION",level:"N3",pool:"DIAG",tags:["迷惑","コロケーション","diag:TARGET_LANGUAGE"],payload:{stem:"電車の中で大きな声で電話をしてしまい、周りの乗客に（　）をかけたと反省した。",choices:[{id:"a",text:"遠慮",whyWrong:"'遠慮'는 사양하다·삼가다라는 뜻으로 '遠慮をかける'라는 표현은 없으며, 'かける'의 대상이 되지도 않습니다.",howToCorrect:"'遠慮する', '遠慮なく' 형태로 쓰며, 이 문장에서는 '迷惑をかけた'가 맞습니다."},{id:"b",text:"失礼",whyWrong:"'失礼をかける'는 자연스러운 연어(collocation)가 아닙니다. '失礼'는 '失礼をする', '失礼なことをした'처럼 쓰며, 남에게 폐를 끼친다는 뜻으로는 '迷惑をかける'가 표준적인 표현입니다.",howToCorrect:"'失礼なことをした'로 바꿔 말하거나, 'かける'와 어울리는 '迷惑'를 사용합니다."},{id:"c",text:"迷惑"},{id:"d",text:"注意",whyWrong:"'注意'는 '注意をする', '注意を受ける'처럼 쓰며 '注意をかける'라고는 하지 않습니다. 또한 반성하는 내용과도 맞지
